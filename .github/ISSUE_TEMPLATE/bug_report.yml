name: Bug report
description: Something in the skill is wrong, stale, or doesn't work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the **skill** — its instructions, reference docs, and packaging.
        For problems with CrowdSec itself, open an issue on
        [crowdsecurity/crowdsec](https://github.com/crowdsecurity/crowdsec/issues).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - crowdsec skill — install
        - crowdsec skill — configure
        - crowdsec skill — bouncers
        - crowdsec skill — WAF / AppSec
        - crowdsec skill — operate
        - crowdsec skill — debug
        - crowdsec skill — migrate
        - crowdsec-service-api skill
        - Packaging / install of the plugin itself
        - Other
    validations:
      required: true

  - type: input
    id: doc
    attributes:
      label: Which file?
      description: Path to the reference doc, if you know it.
      placeholder: skills/crowdsec/references/install/docker.md
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the skill told you to do, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - bare-metal / systemd
        - Docker
        - Kubernetes / Helm
        - pfSense / OPNsense / FreeBSD
        - Not environment-specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CrowdSec version
      description: Output of `cscli version`, if relevant.
      placeholder: "1.8.1"
    validations:
      required: false

  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: Claude Code 2.x / Codex / Claude.ai web
    validations:
      required: false
